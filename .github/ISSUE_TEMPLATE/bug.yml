name: Bug report
description: Report a reproducible problem using synthetic data
body:
  - type: markdown
    attributes:
      value: Do not include private conversations, keys, tokens or local personal paths. See SECURITY.md for vulnerability reporting.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, operating system, Node/browser version, and agent if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Steps, expected result, actual result and sanitized errors.
    validations:
      required: true
